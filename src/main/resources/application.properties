# The name Spring Boot uses internally to identify this application
# (shows up in logs, actuator endpoints, etc.).
spring.application.name=student-management-system

# The port the embedded web server listens on. ${PORT:8080} means
# "use the PORT environment variable if it's set, otherwise default
# to 8080". This makes it easy to change the port on a cloud host
# (like AWS) without touching any code.
server.port=${PORT:8080}

# Database connection settings. Just like the port above, each of
# these can be overridden with an environment variable, which is how
# we avoid hardcoding real credentials for production. See the
# .env.example file for the environment variables this app reads.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${DB_USERNAME:studentapp}
spring.datasource.password=${DB_PASSWORD:studentpass}

# "update" tells Hibernate to automatically create/alter database
# tables to match our @Entity classes. This is convenient for a
# student project, but a real production app would usually use a
# proper migration tool instead (like Flyway or Liquibase), so that
# schema changes are tracked and reviewed like any other code change.
spring.jpa.hibernate.ddl-auto=update

# Keeps the database session open only as long as needed for each
# request, instead of for the whole request/response cycle. This is
# considered better practice and avoids some subtle bugs and
# performance issues with lazy-loaded relationships.
spring.jpa.open-in-view=false

# When show-sql is turned on (see below), this makes the printed SQL
# statements easier to read by adding line breaks and indentation.
spring.jpa.properties.hibernate.format_sql=true

# Set this to "true" temporarily if you want to see every SQL
# statement Hibernate runs printed to the console - useful for
# understanding exactly what's happening under the hood.
spring.jpa.show-sql=false

# The URL path where Swagger UI (the interactive API documentation
# page) will be available once the app is running.
springdoc.swagger-ui.path=/swagger-ui.html
